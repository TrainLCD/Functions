# アプリに届いたフィードバックのうち、原因がこのリポジトリにあると判定された
# ものを Claude Code に読ませ、直せるなら修正の Pull Request まで作らせる。
#
# 起点はこのリポジトリのフィードバックトリアージが自分で立てるスタブ issue。
# 原因のリポジトリは受信時に判定済みなので、ここで振り分けをやり直さない。
# 判定・無害化・プロンプトの組み立て・結果の報告は TrainLCD/feedback-autofix
# の composite action が持っている。
#
# 出来上がった PR は必ず人がレビューすること。フィードバックの本文はアプリの
# 利用者がそのまま書いたもので、誰かが内容を確かめる工程が無い。個人情報を
# 取り除いたうえでデータとして渡しているが、プロンプトインジェクションの
# 抜け道を完全にはふさげない。自動マージもしない。
name: Auto Fix From Feedback

on:
  # トリアージがこのリポジトリに立てるスタブ issue を起点にする。
  issues:
    types: [opened]
  # 取りこぼしをやり直すときと、スタブを介さず動かすときに使う。
  workflow_dispatch:
    inputs:
      issue_number:
        description: "TrainLCD/Issues の issue 番号"
        required: true
        type: string

permissions:
  contents: write
  # prepare がスタブ issue を GITHUB_TOKEN で取得する。permissions を書いた
  # 時点で挙げなかった権限は none になるので、これを省くとそこで止まる。
  issues: read
  pull-requests: write

# 同じ管理チケットに対する実行を直列にする。スタブ issue の番号で束ねると、
# 同じチケットを指すスタブが 2 つあったときに別のグループへ入って同時に走る。
# エージェントが 2 つ動き、同じ名前のブランチを取り合う。
#
# 題名には管理チケットへの参照が入っていて、トリアージが立てるものも引き継ぎで
# 立つものも同じ形なので、これで同じチケットは同じグループに入る。
# cancel-in-progress を false にしてあるので後続は待たされ、先行が結果を
# 書き終えてから動き出してそこで打ち切られる。
#
# 題名にコロンが入るため、値は引用符で囲むこと。囲まないと YAML がそこを
# キーの区切りと読み、このファイルを読み込めなくなる。
concurrency:
  group: "auto-fix-from-feedback-${{ github.event.issue.title || format('フィードバック対応: {0}#{1}', 'TrainLCD/Issues', inputs.issue_number) }}"
  cancel-in-progress: false

jobs:
  auto-fix:
    name: Auto fix from feedback
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # environment を宣言しない。ci.yml と同じ理由で、宣言するとこのジョブが
    # その環境へのデプロイとして履歴に載り、環境 Secret に触れる状態になる。
    steps:
      # persist-credentials: false を外さないこと。既定の true だと、書き込み
      # 権限付きの GITHUB_TOKEN がローカルの git 設定に残り、npm ci の
      # postinstall とエージェントの Bash(git:*) から素で使える状態になる。
      # 外部 action は可変タグではなく commit SHA で固定する。このジョブは
      # contents: write と pull-requests: write を持ち、secret も渡している。
      # タグが差し替えられると、その内容がここで動く。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - uses: TrainLCD/feedback-autofix/prepare@v1
        id: prepare
        with:
          stub_issue_number: ${{ github.event.issue.number }}
          issue_number: ${{ inputs.issue_number }}
          # スタブ issue の作成者として認めるアカウントの数値 ID。このリポジトリ
          # は公開されていて issue は誰でも立てられるので、これが無いと第三者が
          # 管理チケットの番号を書いた issue を立てるだけで、非公開チケットの
          # 本文を取得させられる。
          allowed_authors: "32848922"
          issues_repo_token: ${{ secrets.ISSUES_REPO_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # 共通アクションの既定は P1 だけ。2026 年に入って立った Bug は P1 が
          # 8 件、P2 が 43 件、P3 が 3 件（duplicate と Spam を除く）で、P1 だけだと
          # 月 1 件動くかどうかになる。3 つ足しても月 6 件程度（54 件 ÷ 8.6 か月）。
          #
          # P3 を外す理由は無い。作るものから決める Feature Request や Improvement は
          # カテゴリの条件が弾くので、ここへ残るのは Bug と Crash だけ。
          #
          # 3 つとも入れたことでこの条件はほぼ素通りになるが、外さないこと。優先度が
          # 付く前の issue を先に渡さないための関門になっている。
          triage_labels: "🟠 P1 / High,🟡 P2 / Medium,🟢 P3 / Low"
          handoffs: MobileApp,StationAPI
          guidelines_file: AGENTS.md
          # このリポジトリに PR テンプレートは無い。
          pr_template: ""
          # .github/actions/verify/action.yml が回すものと同じ。バンドルまで
          # 入れてあるのは、tsc が型しか見ないため、import の解決ミスや
          # nodejs_compat で賄えない Node API はバンドルして初めて落ちるから。
          # これを省くと、3 つを通した PR が CI のビルドで落ちる。
          checks: |
            npm run lint
            npm run typecheck
            npm test
            npx wrangler deploy --env="" --dry-run --outdir /tmp/feedback-autofix-bundle-dev
            npx wrangler deploy --env=production --dry-run --outdir /tmp/feedback-autofix-bundle-production
          scope: |
            - `src/**` の Worker のコード
            - `test/**` のテスト

      # ここから先は対象だったときだけ走らせる。届く issue のうち条件を満たす
      # ものは一部なので、判定より先に重い準備を置かない。
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.prepare.outputs.eligible == 'true'
        with:
          # package.json の engines と .github/actions/verify の既定に揃えること。
          node-version: "22"
          cache: npm

      - run: npm ci
        if: steps.prepare.outputs.eligible == 'true'

      - uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1
        id: claude
        if: steps.prepare.outputs.eligible == 'true'
        env:
          # wrangler の色付けが Total Upload 行に混ざると読めなくなる。
          NO_COLOR: "1"
          WRANGLER_SEND_METRICS: "false"
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: ${{ steps.prepare.outputs.prompt }}
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "Edit,Read,Write,Glob,Grep,TodoWrite,Bash(npm:*),Bash(npx:*),Bash(git:*),Bash(gh:*),Bash(node:*)"

      # always() を外さないこと。エージェントが失敗した場合こそ報告が要る。
      # 何も言わずに終わると、管理チケットを見た人には「調べたうえで何もしな
      # かった」のか「そもそも動かなかった」のかが分からない。
      - uses: TrainLCD/feedback-autofix/report@v1
        if: ${{ always() && steps.prepare.outputs.eligible == 'true' }}
        with:
          issue_number: ${{ steps.prepare.outputs.issue_number }}
          issues_repo_token: ${{ secrets.ISSUES_REPO_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.prepare.outputs.branch }}
          verdict_path: ${{ steps.prepare.outputs.verdict_path }}
          claude_outcome: ${{ steps.claude.outcome }}
          # 引き継ぎ先に issue を立てられるトークン。省くと引き継ぎ先の名前が
          # コメントに出るだけで、向こうは動かない。
          handoff_token: ${{ secrets.HANDOFF_ISSUE_TOKEN }}
